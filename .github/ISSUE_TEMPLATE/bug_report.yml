name: Bug report
description: Something in DevAgentForce or its documentation does not work as described.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include secrets, tokens, internal hostnames or private repository names.**
        Security vulnerabilities go to SECURITY.md, never to a public issue.
        Licensed users can also send a bug report from the product's Logs page, which attaches diagnostics automatically.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the dashboard footer (for example 2.0.238).
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: ["Free", "Pro", "Pro trial"]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options: ["Native installer", "Desktop app", "Cloud VM", "Other"]
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["Linux x64", "macOS (Apple silicon)", "Windows x64", "Windows ARM64"]
    validations:
      required: true
  - type: dropdown
    id: vendor
    attributes:
      label: Agent vendor involved
      multiple: true
      options: ["Claude Code", "Codex", "Antigravity", "Pi", "Not vendor-specific"]
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a task on a Local Git repository with the Patch flow
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (redacted)
      render: text
